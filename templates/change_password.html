<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniTrack | Change password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||''}catch(e){}</script>
</head>
<body>
<div class="auth" style="grid-template-columns:1fr">
    <section class="auth-form">
        <div class="auth-box">
            <h2 class="logo" style="margin:0 0 24px"><i>U</i>UniTrack</h2>
            <h1>{{ 'Set a new password' if forced else 'Change password' }}</h1>
            <p class="sub">{{ 'For your security, choose your own password before continuing.' if forced else 'Use 8+ characters with letters and a number.' }}</p>
            {% include "flash.html" %}
            <form method="post">
                <div class="form-group"><label>Current password</label><input name="current" type="password" required autofocus></div>
                <div class="form-group"><label>New password</label><input name="new" type="password" required minlength="8"></div>
                <div class="form-group"><label>Repeat new password</label><input name="again" type="password" required minlength="8"></div>
                <button class="btn btn-primary btn-block" type="submit">Update password</button>
            </form>
            <p class="auth-alt">{% if not forced %}<a href="{{ home }}">← Back</a> · {% endif %}<a href="/logout">Sign out</a></p>
        </div>
    </section>
</div>
</body>
</html>
