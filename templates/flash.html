{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="toast-stack" aria-live="polite" aria-atomic="false">
      {% for category, message in messages %}
        <div class="toast toast-{{ category }}" role="status">
          <span class="toast-mark" aria-hidden="true">{{ '✓' if category == 'success' else '!' if category in ['error', 'warn'] else 'i' }}</span>
          <span class="toast-message">{{ message }}</span>
          <button class="toast-close" type="button" aria-label="Dismiss notification" onclick="this.closest('.toast').remove()">&times;</button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
<script>
(function () {
  document.querySelectorAll('.toast').forEach(function (toast, index) {
    window.setTimeout(function () {
      if (!toast.isConnected) return;
      toast.classList.add('toast-hide');
      window.setTimeout(function () { toast.remove(); }, 250);
    }, 4200 + index * 250);
  });
})();
</script>
